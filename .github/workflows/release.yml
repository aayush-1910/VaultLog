name: Release

# Push a tag like v0.1.0 to build the Windows executables and publish a GitHub release.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          PKG=$(python -c "import vaultlog; print(vaultlog.__version__)")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match vaultlog.__version__ ($PKG)"; exit 1
          fi

      - name: Test
        run: python -m pytest -v

      - name: Build executables
        run: python scripts/build.py --zip

      - name: Smoke-test CLI executable
        shell: bash
        env:
          VAULTLOG_PATH: ${{ runner.temp }}/smoke.vault
          VAULTLOG_PASSWORD: smoke-test-password
        run: |
          ./dist/vaultlog-cli.exe --version
          ./dist/vaultlog-cli.exe init
          ./dist/vaultlog-cli.exe add -m "smoke test"
          ./dist/vaultlog-cli.exe search smoke

      - uses: actions/upload-artifact@v4
        with:
          name: VaultLog-windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/VaultLog.exe
            dist/vaultlog-cli.exe
            dist/*.zip
            dist/SHA256SUMS.txt
